baseURL = 'https://healing-honey.pp.ua/'
locale = 'uk-UA'
defaultContentLanguage = "uk"
title = 'Цілющий мед | Блог пасічника Сергія Поліщука'
theme = 'pehtheme-hugo'
disableKinds = ["taxonomy", "term"]
summaryLength = 20

[params]
	description = 'Блог пасічника Сергія Поліщука про прополіс, мед, настоянки та практичний досвід бджільництва.'
	mainSections = ['posts']
	[params.author]
		name = 'Сергій Поліщук'
		bio = 'Пасічник з власною життєвою філософією'
		avatar = 'images/PSV.jpg'

[pagination]
	pagerSize = 6

[menu]
	[[menu.main]]
	name = 'Головна'
	pageRef = '/'
	weight = 10

	[[menu.main]]
	name = 'Про автора'
	pageRef = '/about'
	weight = 20

	[[menu.main]]
	name = 'Контакти'
	pageRef = '/contact'
	weight = 30

	[[menu.main]]
	name = 'Політика'
	pageRef = '/privacy-policy'
	weight = 40

[module]
  [module.hugoVersion]
    extended = false
    min = "0.116.0"

[permalinks]
  posts = "/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'
